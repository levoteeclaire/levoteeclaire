<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Vote Éclairé - Les votes de l'Assemblée nationale</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .barre-progression {
            display: flex;
            height: 10px;
            border-radius: 9999px;
            overflow: hidden;
            background-color: #f1f5f9;
        }
        .barre-progression > span {
            height: 100%;
            transition: width 0.3s ease;
        }
        .bg-pour { background-color: #10b981; }
        .bg-contre { background-color: #f43f5e; }
        .bg-abstention { background-color: #cbd5e1; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- En-tête -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-2xs">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-xl">🏛️</span>
                <h1 class="text-base font-bold text-slate-900 tracking-tight">Le Vote Éclairé</h1>
            </div>
            <span class="text-[10px] font-semibold px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full border border-indigo-100 uppercase tracking-wide">
                Direct Assemblée
            </span>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-4xl mx-auto px-3 sm:px-4 py-4 flex-grow w-full space-y-4">
        
        <!-- Zone de Filtres & Recherche -->
        <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200/80 shadow-2xs space-y-3">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs">🔍</span>
                <input 
                    type="text" 
                    id="searchInput" 
                    oninput="gererRecherche()" 
                    placeholder="Rechercher un sujet, un mot-clé (ex: écologie, budget)..." 
                    class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                >
            </div>

            <!-- Filtres thématiques -->
            <div>
                <span class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Thématiques</span>
                <div id="theme-filters" class="flex flex-wrap gap-1.5">
                    <button onclick="filtrerTheme('TOUS')" class="btn-theme bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-medium transition">Tous</button>
                </div>
            </div>
        </div>

        <!-- Conteneur des cartes de scrutins -->
        <section id="scrutins-container" class="space-y-4">
            <div class="text-center py-12 text-slate-400 text-xs">Chargement des scrutins...</div>
        </section>

    </main>

    <!-- Pied de page -->
    <footer class="border-t border-slate-200 bg-white py-4 text-center text-[11px] text-slate-400">
        <p>Données officielles en Open Data • Traitement pédagogique neutre par IA</p>
    </footer>

    <!-- JavaScript -->
    <script>
        let scrutinsData = [];
        let themeActif = 'TOUS';
        let termeRecherche = '';

        // Mapping complet des groupes parlementaires (17e, 16e, 15e législatures)
        const MAPPING_GROUPES = {
            "PO840056": "Non inscrit",
            "PO845401": "Rassemblement National",
            "PO845407": "Ensemble pour la République",
            "PO845413": "La France insoumise - NFP",
            "PO845419": "Socialistes et apparentés",
            "PO845425": "Droite Républicaine",
            "PO845439": "Écologiste et Social",
            "PO845454": "Les Démocrates",
            "PO845470": "Horizons & Indépendants",
            "PO845485": "Libertés, Indépendants, Outre-mer et Territoires",
            "PO845514": "Gauche Démocrate et Républicaine",
            "PO845520": "À Droite",
            "PO847173": "UDR",
            "PO872880": "Union des droites pour la République",

            "PO793087": "Non inscrit",
            "PO800484": "Démocrate (MoDem)",
            "PO800490": "La France insoumise - NUPES",
            "PO800496": "Socialistes et apparentés",
            "PO800502": "Gauche démocrate et républicaine",
            "PO800508": "Les Républicains",
            "PO800514": "Horizons et apparentés",
            "PO800520": "Rassemblement National",
            "PO800526": "Écologiste",
            "PO800532": "LIOT",
            "PO800538": "Renaissance",
            "PO830170": "Socialistes et apparentés",

            "PO723569": "Non inscrit",
            "PO730934": "Les Républicains",
            "PO730940": "Gauche démocrate et républicaine",
            "PO730946": "Nouvelle Gauche",
            "PO730952": "Les Constructifs (UDI)",
            "PO730958": "La France insoumise",
            "PO730964": "La République en Marche",
            "PO730970": "Mouvement Démocrate",
            "PO744425": "UDI et Indépendants",
            "PO758835": "Socialistes et apparentés",
            "PO759900": "Libertés et Territoires",
            "PO765636": "UDI et Indépendants",
            "PO767217": "UDI et Indépendants",
            "PO771789": "Écologie Démocratie Solidarité",
            "PO771889": "UDI et Indépendants",
            "PO771923": "Agir ensemble",
            "PO774834": "Mouvement Démocrate (MoDem)"
        };

        // Ordre d'affichage de la Gauche vers la Droite dans l'Hémicycle
        const ORDRE_HEMICYCLE = [
            { re: /insoumise/, o: 1, color: '#e11d48' },
            { re: /gauche democrate/, o: 2, color: '#9f1239' },
            { re: /ecologiste|ecologie/, o: 3, color: '#16a34a' },
            { re: /socialiste|nouvelle gauche/, o: 4, color: '#ec4899' },
            { re: /libertes|liot|territoires/, o: 5, color: '#d97706' },
            { re: /democrate|modem/, o: 6, color: '#f59e0b' },
            { re: /ensemble|renaissance|republique en marche/, o: 7, color: '#1d4ed8' },
            { re: /horizons/, o: 8, color: '#0ea5e9' },
            { re: /constructifs|udi|agir/, o: 9, color: '#38bdf8' },
            { re: /droite republicaine|les republicains/, o: 10, color: '#1e3a8a' },
            { re: /udr|union des droites/, o: 11, color: '#312e81' },
            { re: /rassemblement national/, o: 12, color: '#334155' },
            { re: /non inscrit/, o: 99, color: '#94a3b8' }
        ];

        // Normalisation sans accents et en minuscules
        const normaliserTexte = str => (str || '').normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();

        function getNomGroupe(nomBrut) {
            if (!nomBrut) return "Groupe inconnu";
            const matchPo = nomBrut.match(/(PO\d+)/);
            if (matchPo && MAPPING_GROUPES[matchPo[1]]) return MAPPING_GROUPES[matchPo[1]];
            if (MAPPING_GROUPES[nomBrut.trim()]) return MAPPING_GROUPES[nomBrut.trim()];
            let net = nomBrut.replace(/Groupe\s*\([^)]+\)/g, '').trim();
            return net.length > 0 ? net : nomBrut;
        }

        function getMetadonneesGroupe(nomComplet) {
            const norm = normaliserTexte(nomComplet);
            const trouve = ORDRE_HEMICYCLE.find(item => item.re.test(norm));
            return trouve || { o: 50, color: '#64748b' };
        }

        function gererRecherche() {
            termeRecherche = normaliserTexte(document.getElementById('searchInput').value.trim());
            afficherScrutins();
        }
        
        // Fonction pour mélanger un tableau de façon aléatoire (Fisher-Yates)
        function melangerTableau(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }


        async function chargerDonnees() {
            try {
                const response = await fetch('./data_processed/scrutins_enrichis.json');
                if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`);
                const data = await response.json();
                
                // Mélange aléatoire des scrutins au chargement
                scrutinsData = melangerTableau(data);

                initialiserFiltres();
                afficherScrutins();
            } catch (error) {
                console.error("Erreur chargement :", error);
                document.getElementById('scrutins-container').innerHTML = `
                    <div class="text-center py-10 bg-white rounded-2xl border border-rose-200 p-6">
                        <p class="text-xs font-bold text-rose-700">Impossible de charger le fichier JSON.</p>
                        <p class="text-[11px] text-slate-500 mt-1">Vérifiez que le serveur local est actif.</p>
                    </div>`;
            }
        }
        function formaterBlocRiche(contexteObj) {
            if (!contexteObj) return { intentionsHtml: '', critiqueHtml: '', expertsHtml: '' };

            function extraireTexte(valeur) {
                if (!valeur) return '';
                if (typeof valeur === 'string' || typeof valeur === 'number') return valeur;
                if (Array.isArray(valeur)) {
                    return valeur.map(item => typeof item === 'object' ? Object.values(item).filter(Boolean).join(' — ') : item).join('<br>');
                }
                if (typeof valeur === 'object') {
                    return Object.entries(valeur).map(([k, v]) => `<strong>${k.replace(/_/g, ' ')} :</strong> ${extraireTexte(v)}`).join('<br>');
                }
                return '';
            }

            const intentionsData = contexteObj.intentions_auteurs || contexteObj.mesures_cles || Object.values(contexteObj)[0];
            let intentionsHtml = Array.isArray(intentionsData) 
                ? intentionsData.map(i => `<div class="mb-1.5 text-xs text-slate-700">🔹 ${typeof i === 'object' ? Object.values(i).filter(Boolean).join(' : ') : i}</div>`).join('')
                : `<div class="text-xs text-slate-700">${extraireTexte(intentionsData)}</div>`;

            const critiqueData = contexteObj.impact_et_critique || contexteObj.points_de_clivage || Object.values(contexteObj)[1];
            let critiqueHtml = `<div class="text-xs text-slate-700 space-y-1">${extraireTexte(critiqueData)}</div>`;

            const expertsData = contexteObj.avis_experts || Object.values(contexteObj)[2];
            let expertsHtml = `<div class="text-xs text-slate-700 space-y-1">${extraireTexte(expertsData)}</div>`;

            return { intentionsHtml, critiqueHtml, expertsHtml };
        }

        function initialiserFiltres() {
            const themes = ['TOUS', ...new Set(scrutinsData.map(s => s.theme_principal).filter(Boolean))];
            const filterContainer = document.getElementById('theme-filters');
            
            filterContainer.innerHTML = themes.map(t => {
                const tSec = t.replace(/'/g, "\\'");
                const active = t === themeActif;
                const cls = active 
                    ? "btn-theme bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-medium shadow-2xs transition" 
                    : "btn-theme bg-slate-100 border border-slate-200 text-slate-600 hover:bg-slate-200 px-3 py-1 rounded-full text-xs font-medium transition";
                return `<button onclick="filtrerTheme('${tSec}')" class="${cls}">${t}</button>`;
            }).join('');
        }

        function filtrerTheme(theme) {
            themeActif = theme;
            document.querySelectorAll('.btn-theme').forEach(btn => {
                const txt = btn.innerText.trim();
                if (txt === theme || (theme === 'TOUS' && txt === 'Tous')) {
                    btn.className = "btn-theme bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-medium shadow-2xs transition";
                } else {
                    btn.className = "btn-theme bg-slate-100 border border-slate-200 text-slate-600 hover:bg-slate-200 px-3 py-1 rounded-full text-xs font-medium transition";
                }
            });
            afficherScrutins();
        }

        function switcherSousOnglet(cardIdx, sectionName) {
            const sections = ['vote', 'essentiel', 'debat', 'experts'];
            sections.forEach(sec => {
                const el = document.getElementById(`card-${cardIdx}-${sec}`);
                const btn = document.getElementById(`btn-${cardIdx}-${sec}`);
                if (el && btn) {
                    if (sec === sectionName) {
                        el.classList.remove('hidden');
                        btn.className = "flex-1 py-1.5 text-center text-[11px] font-bold text-indigo-700 bg-white rounded-lg shadow-2xs transition";
                    } else {
                        el.classList.add('hidden');
                        btn.className = "flex-1 py-1.5 text-center text-[11px] font-medium text-slate-500 hover:text-slate-800 transition";
                    }
                }
            });
        }

        function genererBarresHorizontales(votesGroupes) {
            if (!Array.isArray(votesGroupes) || votesGroupes.length === 0) {
                return '<p class="text-xs text-slate-400 italic py-2">Détail par groupe indisponible.</p>';
            }

            // Normalisation, ajout des métadonnées et tri de Gauche à Droite
            const groupesTries = votesGroupes.map(g => {
                const nom = getNomGroupe(g.nom_groupe);
                const meta = getMetadonneesGroupe(nom);
                const p = Number(g.detail?.pour || 0);
                const c = Number(g.detail?.contre || 0);
                const a = Number(g.detail?.abstention || 0);
                return { nom, meta, pour: p, contre: c, abstention: a, total: p + c + a };
            }).sort((a, b) => a.meta.o - b.meta.o);

            return `
                <div class="space-y-2.5 pt-1">
                    <div class="flex items-center justify-between text-[11px] text-slate-500 font-medium pb-1 border-b border-slate-100">
                        <span class="flex items-center gap-3">
                            <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>Pour</span>
                            <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-500"></span>Contre</span>
                            <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-slate-300"></span>Abstention</span>
                        </span>
                        <span>Position majoritaire</span>
                    </div>

                    <div class="space-y-2">
                        ${groupesTries.map(g => {
                            if (g.total === 0) return '';
                            const pctPour = ((g.pour / g.total) * 100).toFixed(1);
                            const pctContre = ((g.contre / g.total) * 100).toFixed(1);
                            const pctAbst = ((g.abstention / g.total) * 100).toFixed(1);

                            let majTexte = "Abstention";
                            let majColor = "text-slate-500";
                            if (g.pour >= g.contre && g.pour >= g.abstention) {
                                majTexte = `Pour (${Math.round(pctPour)}%)`;
                                majColor = "text-emerald-600";
                            } else if (g.contre >= g.pour && g.contre >= g.abstention) {
                                majTexte = `Contre (${Math.round(pctContre)}%)`;
                                majColor = "text-rose-600";
                            }

                            return `
                                <div class="space-y-0.5">
                                    <div class="flex items-center justify-between text-xs">
                                        <span class="font-medium text-slate-800 truncate pr-2 flex items-center gap-1.5">
                                            <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" style="background-color: ${g.meta.color}"></span>
                                            ${g.nom}
                                        </span>
                                        <span class="font-bold text-[11px] ${majColor} flex-shrink-0">${majTexte}</span>
                                    </div>
                                    <div class="barre-progression">
                                        <span class="bg-pour" style="width: ${pctPour}%" title="Pour: ${g.pour}"></span>
                                        <span class="bg-contre" style="width: ${pctContre}%" title="Contre: ${g.contre}"></span>
                                        <span class="bg-abstention" style="width: ${pctAbst}%" title="Abstention: ${g.abstention}"></span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function afficherScrutins() {
            const container = document.getElementById('scrutins-container');
            if (!container) return;

            let filtrés = themeActif === 'TOUS' ? scrutinsData : scrutinsData.filter(s => s.theme_principal === themeActif);

            // Recherche insensible aux accents
            if (termeRecherche) {
                filtrés = filtrés.filter(s => {
                    const tv = normaliserTexte(s.titre_vulgarise);
                    const to = normaliserTexte(s.titre_officiel || s.titre);
                    const th = normaliserTexte(s.theme_principal);
                    const ctx = normaliserTexte(JSON.stringify(s.contexte_et_objectif || ''));
                    return tv.includes(termeRecherche) || to.includes(termeRecherche) || th.includes(termeRecherche) || ctx.includes(termeRecherche);
                });
            }

            if (filtrés.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-200 p-4">
                        <p class="text-slate-400 text-xs">Aucun résultat trouvé.</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtrés.map((scrutin, idx) => {
                const estAdopte = (scrutin.resultat_global?.decision || scrutin.sort_libelle || '').toLowerCase().includes('adopté');
                const badgeColor = estAdopte ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200';
                const blocs = formaterBlocRiche(scrutin.contexte_et_objectif);

                return `
                <article class="bg-white border border-slate-200/90 rounded-2xl p-4 sm:p-6 shadow-2xs">
                    
                    <!-- Header Carte -->
                    <div class="flex items-center justify-between gap-2 mb-2">
                        <span class="text-[10px] font-semibold px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md">
                            ${scrutin.theme_principal || 'Général'}
                        </span>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-slate-400">${scrutin.date || scrutin.dateScrutin || ''}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${badgeColor}">
                                ${scrutin.resultat_global?.decision || scrutin.sort_libelle || 'Résultat'}
                            </span>
                        </div>
                    </div>

                    <!-- Titre -->
                    <div class="mb-4">
                        <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-snug mb-1">
                            ${scrutin.titre_vulgarise || scrutin.titre || 'Titre non disponible'}
                        </h3>
                        <p class="text-[11px] text-slate-400 italic line-clamp-2">
                            📄 ${scrutin.titre_officiel || 'Titre officiel non disponible'}
                        </p>
                    </div>

                     <!-- Onglets mobiles -->
                    <div class="flex md:hidden bg-slate-100 p-1 rounded-xl mb-3 border border-slate-200/50">
                        <button id="btn-${idx}-vote" onclick="switcherSousOnglet(${idx}, 'vote')" class="flex-1 py-1.5 text-center text-[11px] font-bold text-indigo-700 bg-white rounded-lg shadow-2xs transition">📊 Vote</button>
                        <button id="btn-${idx}-essentiel" onclick="switcherSousOnglet(${idx}, 'essentiel')" class="flex-1 py-1.5 text-center text-[11px] font-medium text-slate-500 hover:text-slate-800 transition">📋 Mesures</button>
                        <button id="btn-${idx}-debat" onclick="switcherSousOnglet(${idx}, 'debat')" class="flex-1 py-1.5 text-center text-[11px] font-medium text-slate-500 hover:text-slate-800 transition">⚖️ Débat</button>
                        <button id="btn-${idx}-experts" onclick="switcherSousOnglet(${idx}, 'experts')" class="flex-1 py-1.5 text-center text-[11px] font-medium text-slate-500 hover:text-slate-800 transition">🔍 Fact-check</button>
                    </div>

                    <!-- Contenu -->
                    <div class="space-y-4">
                        
                        <!-- 1. Barres Horizontales des votes -->
                        <div id="card-${idx}-vote" class="block space-y-2">
                            <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider hidden md:block mb-2">Ventilation du vote par groupe</h4>
                            ${genererBarresHorizontales(scrutin.votes_par_groupe)}
                        </div>

                        <!-- Grille Desktop des 3 blocs d'analyse -->
                        <div class="grid md:grid-cols-3 gap-3">
                            <div id="card-${idx}-essentiel" class="block space-y-3 pt-1">
                                <div class="bg-blue-50/60 p-3 rounded-xl border border-blue-100 border-l-4 border-l-blue-500 h-full">
                                    <strong class="block text-[10px] font-bold text-blue-900 uppercase tracking-wider mb-1">📋 Ce que change la loi</strong>
                                    ${blocs.intentionsHtml}
                                </div>
                            </div>

                            <div id="card-${idx}-debat" class="hidden md:block space-y-3 pt-1">
                                <div class="bg-amber-50/60 p-3 rounded-xl border border-amber-100 border-l-4 border-l-amber-500 h-full">
                                    <strong class="block text-[10px] font-bold text-amber-900 uppercase tracking-wider mb-1">⚖️ Points de clivage & Débats</strong>
                                    ${blocs.critiqueHtml}
                                </div>
                            </div>

                            <div id="card-${idx}-experts" class="hidden md:block pt-1">
                                <div class="bg-purple-50/60 p-3 rounded-xl border border-purple-200 h-full">
                                    <div class="flex items-center justify-between mb-1">
                                        <span class="text-[10px] font-bold text-purple-950 uppercase tracking-wider">🔍 Fact-check & Experts</span>
                                    </div>
                                    <div class="text-slate-700 text-xs leading-relaxed space-y-1">
                                        ${blocs.expertsHtml}
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                </article>`;
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', chargerDonnees);
    </script>
</body>
</html>
