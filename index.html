<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Vote Éclairé - Les votes de l'Assemblée nationale</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-strong: #0f172a;
            --text-soft: #475569;
            --text-faint: #64748b;
            --accent: #4f46e5;
            --accent-strong: #4338ca;
            --accent-soft: #eef2ff;

            --pour: #10b981;   --pour-txt: #047857;
            --contre: #f43f5e; --contre-txt: #be123c;
            --abst: #cbd5e1;   --abst-txt: #475569;

            --radius: 16px;
            --tap: 44px;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        button, input { font: inherit; color: inherit; }
        button { cursor: pointer; }
        :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

        /* ---------- En-tête ---------- */
        .site-header {
            position: sticky; top: 0; z-index: 50;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .site-header__inner {
            max-width: 56rem; margin: 0 auto; padding: 10px 16px;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-strong); }
        .pill-live {
            font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px;
            background: var(--accent-soft); color: var(--accent-strong); border: 1px solid #e0e7ff;
        }

        /* ---------- Contenu ---------- */
        main {
            flex: 1 0 auto; width: 100%; max-width: 56rem; margin: 0 auto;
            padding: 16px 12px; display: grid; gap: 16px; align-content: start;
        }
        @media (min-width: 640px) { main { padding: 16px; } }

        .panel-box {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px; display: grid; gap: 12px;
        }

        /* Recherche */
        .search { position: relative; }
        .search__icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; }
        .search input {
            width: 100%; min-height: 48px; padding: 0 44px 0 42px;
            background: #f8fafc; border: 1px solid var(--border); border-radius: 12px;
            font-size: 16px;
            -webkit-appearance: none; appearance: none;
        }
        .search input::placeholder { color: var(--text-faint); }
        .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px #c7d2fe; background: #fff; }
        .search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
        .search__clear {
            position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
            width: var(--tap); height: var(--tap); border: 0; background: transparent;
            border-radius: 12px; color: var(--text-soft); font-size: 20px; line-height: 1;
        }
        .search__clear[hidden] { display: none; }

        /* Filtres thématiques */
        .filters-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
        .chips {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
            scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
        }
        .chip {
            flex: 0 0 auto; min-height: var(--tap); padding: 0 16px;
            border-radius: 999px; border: 1px solid var(--border);
            background: #f1f5f9; color: var(--text-soft);
            font-size: 14px; font-weight: 500; white-space: nowrap; scroll-snap-align: start;
        }
        .chip:hover { background: var(--border); }
        .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
        @media (min-width: 768px) {
            .chips { flex-wrap: wrap; overflow: visible; }
            .chip { min-height: 40px; }
        }

        .compteur { margin: 0; font-size: 13px; color: var(--text-soft); }

        /* ---------- Carte de scrutin ---------- */
        .liste { display: grid; gap: 16px; }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
        }
        @media (min-width: 640px) { .card { padding: 24px; } }

        .card__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .tag { font-size: 13px; font-weight: 600; padding: 2px 10px; background: #f1f5f9; color: var(--text-soft); border-radius: 8px; }
        .card__meta { display: flex; align-items: center; gap: 8px; }
        .date { font-size: 13px; color: var(--text-soft); }
        .badge { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid; }
        .badge--ok { background: #ecfdf5; color: var(--pour-txt); border-color: #a7f3d0; }
        .badge--ko { background: #fff1f2; color: var(--contre-txt); border-color: #fecdd3; }

        .card__title { margin: 0 0 4px; font-size: 18px; line-height: 1.3; font-weight: 700; color: var(--text-strong); }
        @media (min-width: 640px) { .card__title { font-size: 20px; } }
        .card__official {
            margin: 0 0 14px; font-size: 13px; font-style: italic; color: var(--text-faint);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* Score global */
        .score { margin-bottom: 16px; }
        .score__nums { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; margin-bottom: 8px; }
        .score__n { font-size: 14px; color: var(--text-soft); }
        .score__n b { font-size: 24px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
        .score__n--pour b { color: var(--pour-txt); }
        .score__n--contre b { color: var(--contre-txt); }
        .score__n--abst b { color: var(--abst-txt); }
        .score__marge { margin: 8px 0 0; font-size: 13px; color: var(--text-soft); }

        .bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: #f1f5f9; }
        .bar--big { height: 16px; }
        .bar > span { display: block; height: 100%; }
        .seg-pour { background: var(--pour); }
        .seg-contre { background: var(--contre); }
        .seg-abst { background: var(--abst); }

        /* ---------- Onglets / Blocs ---------- */
        .tabs {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
            background: #f1f5f9; padding: 4px; border-radius: 14px;
            border: 1px solid #e2e8f0; margin-bottom: 14px;
        }
        .tabs button {
            min-height: 52px; padding: 4px 2px; border: 0; background: transparent; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
            font-size: 13px; font-weight: 500; color: var(--text-soft);
        }
        .tabs button span:first-child { font-size: 16px; line-height: 1.2; }
        .tabs button[aria-selected="true"] {
            background: #fff; color: var(--accent-strong); font-weight: 700;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .12);
        }

        .pane { display: none; }
        .card[data-tab="vote"] .pane--vote,
        .card[data-tab="essentiel"] .pane--essentiel,
        .card[data-tab="debat"] .pane--debat,
        .card[data-tab="experts"] .pane--experts { display: block; }

        .analyses { display: block; }

        @media (min-width: 768px) {
            .tabs { display: none; }
            .pane { display: block; }
            .analyses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
        }

        .pane-title { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: var(--text-strong); }
        @media (max-width: 767px) { .pane--vote .pane-title { display: none; } }

        .bloc { height: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid; border-left-width: 4px; font-size: 14px; line-height: 1.55; color: var(--text); }
        .bloc__title { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 700; }
        .bloc--essentiel { background: #eff6ff; border-color: #dbeafe; border-left-color: #3b82f6; }
        .bloc--essentiel .bloc__title { color: #1e3a8a; }
        .bloc--debat { background: #fffbeb; border-color: #fef3c7; border-left-color: #f59e0b; }
        .bloc--debat .bloc__title { color: #78350f; }
        .bloc--experts { background: #faf5ff; border-color: #e9d5ff; border-left-color: #a855f7; }
        .bloc--experts .bloc__title { color: #3b0764; }
        .bloc__item { margin-bottom: 6px; padding-left: 14px; position: relative; }
        .bloc__item::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .5; }
        .bloc__vide { color: var(--text-faint); font-style: italic; }

        /* ---------- Barres par groupe (100 %, noms complets) ---------- */
        .legende { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 10px; padding: 0; list-style: none; font-size: 13px; color: var(--text-soft); }
        .legende i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

        .groupes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
        @media (min-width: 640px) { .groupes { grid-template-columns: 1fr 1fr; column-gap: 28px; } }
        
        /* Grille adaptée : Nom complet du groupe à gauche, barre au milieu, pourcentage à droite */
        .groupe { display: grid; grid-template-columns: minmax(130px, 1fr) 110px 72px; align-items: center; gap: 8px; min-height: 28px; }
        .nom-groupe { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .nom-groupe i { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--c, #94a3b8); }
        
        .position { text-align: right; font-size: 13px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .position--pour { color: var(--pour-txt); }
        .position--contre { color: var(--contre-txt); }
        .position--abst { color: var(--abst-txt); }

        /* ---------- Divers ---------- */
        .plus {
            display: block; width: 100%; min-height: 48px; border-radius: 12px;
            border: 1px solid var(--accent); background: #fff; color: var(--accent-strong);
            font-size: 15px; font-weight: 600;
        }
        .plus:hover { background: var(--accent-soft); }
        .plus[hidden] { display: none; }

        .etat { text-align: center; padding: 40px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-soft); font-size: 14px; }
        .etat--erreur { border-color: #fecdd3; }
        .etat--erreur strong { display: block; color: var(--contre-txt); margin-bottom: 4px; }

        .site-footer { border-top: 1px solid var(--border); background: var(--surface); padding: 16px; text-align: center; font-size: 13px; color: var(--text-soft); }
        .site-footer p { margin: 0; }

        @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="site-header__inner">
            <div class="brand">
                <span aria-hidden="true" style="font-size:20px">🏛️</span>
                <h1>Le Vote Éclairé</h1>
            </div>
            <span class="pill-live">Direct Assemblée</span>
        </div>
    </header>

    <main>
        <div class="panel-box">
            <div class="search">
                <span class="search__icon" aria-hidden="true">🔍</span>
                <input type="search" id="searchInput" enterkeyhint="search" autocomplete="off"
                       placeholder="Rechercher un sujet, un mot-clé…" aria-label="Rechercher un scrutin">
                <button type="button" class="search__clear" id="searchClear" aria-label="Effacer la recherche" hidden>×</button>
            </div>

            <div>
                <span class="filters-label" id="themes-label">Thématiques</span>
                <div id="theme-filters" class="chips" role="group" aria-labelledby="themes-label">
                    <button type="button" class="chip" data-theme="TOUS" aria-pressed="true">Tous</button>
                </div>
            </div>
        </div>

        <p class="compteur" id="compteur" aria-live="polite"></p>

        <section id="scrutins-container" class="liste" aria-label="Liste des scrutins">
            <div class="etat">Chargement des scrutins…</div>
        </section>

        <button type="button" class="plus" id="plus" hidden></button>
    </main>

    <footer class="site-footer">
        <p>Données officielles en Open Data • Traitement pédagogique neutre par IA</p>
    </footer>

    <script>
        'use strict';

        const PAGE_SIZE = 15;
        const DEBOUNCE_MS = 200;

        let scrutinsData = [];
        let filtres = [];
        let affiches = 0;
        let themeActif = 'TOUS';
        let termeRecherche = '';
        let cardSeq = 0;

        const $container = document.getElementById('scrutins-container');
        const $filters = document.getElementById('theme-filters');
        const $search = document.getElementById('searchInput');
        const $clear = document.getElementById('searchClear');
        const $compteur = document.getElementById('compteur');
        const $plus = document.getElementById('plus');

        const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ESC[c]);

        const norm = s => String(s ?? '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();

        function collecterTexte(v, out = []) {
            if (v == null) return out;
            if (typeof v === 'object') Object.values(v).forEach(x => collecterTexte(x, out));
            else out.push(String(v));
            return out;
        }

        const nombre = v => {
            if (typeof v === 'number' && isFinite(v)) return v;
            if (typeof v === 'string' && v.trim() !== '' && isFinite(+v)) return +v;
            return null;
        };
        const fmt = n => new Intl.NumberFormat('fr-FR').format(n);

        const MAPPING_GROUPES = {
            "PO840056": "Non inscrit",
            "PO845401": "Rassemblement National",
            "PO845407": "Ensemble pour la République",
            "PO845413": "La France insoumise - Nouveau Front Populaire",
            "PO845419": "Socialistes et apparentés",
            "PO845425": "Droite Républicaine",
            "PO845439": "Écologiste et Social",
            "PO845454": "Les Démocrates",
            "PO845470": "Horizons & Indépendants",
            "PO845485": "Libertés, Indépendants, Outre-mer et Territoires",
            "PO845514": "Gauche Démocrate et Républicaine",
            "PO845520": "À Droite",
            "PO847173": "UDR",
            "PO872880": "Union des droites pour la République",

            "PO793087": "Non inscrit",
            "PO800484": "Démocrate (MoDem et Indépendants)",
            "PO800490": "La France insoumise - NUPES",
            "PO800496": "Socialistes et apparentés",
            "PO800502": "Gauche démocrate et républicaine",
            "PO800508": "Les Républicains",
            "PO800514": "Horizons et apparentés",
            "PO800520": "Rassemblement National",
            "PO800526": "Écologiste",
            "PO800532": "Libertés, Indépendants, Outre-mer et Territoires",
            "PO800538": "Renaissance",
            "PO830170": "Socialistes et apparentés",

            "PO723569": "Non inscrit",
            "PO730934": "Les Républicains",
            "PO730940": "Gauche démocrate et républicaine",
            "PO730946": "Nouvelle Gauche",
            "PO730952": "Les Constructifs",
            "PO730958": "La France insoumise",
            "PO730964": "La République en Marche",
            "PO730970": "Mouvement Démocrate",
            "PO744425": "UDI, Agir et Indépendants",
            "PO758835": "Socialistes et apparentés",
            "PO759900": "Libertés et Territoires",
            "PO765636": "UDI et Indépendants",
            "PO767217": "UDI, Agir et Indépendants",
            "PO771789": "Écologie Démocratie Solidarité",
            "PO771889": "UDI et Indépendants",
            "PO771923": "Agir ensemble",
            "PO774834": "Mouvement Démocrate (MoDem)"
        };

        function getNomGroupe(nomBrut) {
            if (!nomBrut) return "Groupe inconnu";
            const matchPo = nomBrut.match(/(PO\d+)/);
            if (matchPo && MAPPING_GROUPES[matchPo[1]]) return MAPPING_GROUPES[matchPo[1]];
            if (MAPPING_GROUPES[nomBrut.trim()]) return MAPPING_GROUPES[nomBrut.trim()];
            const net = nomBrut.replace(/Groupe\s*\([^)]+\)/g, '').trim();
            return net.length > 0 ? net : nomBrut;
        }

        const GROUPES_META = [
            { re: /insoumise/,                                   c: '#e11d48', o: 1 },
            { re: /gauche democrate et republicaine/,            c: '#9f1239', o: 2 },
            { re: /ecologie democratie solidarite/,              c: '#4ade80', o: 3.5 },
            { re: /ecologiste/,                                  c: '#16a34a', o: 3 },
            { re: /socialiste|nouvelle gauche/,                  c: '#ec4899', o: 4 },
            { re: /libertes, independants|libertes et territoires|liot/, c: '#d97706', o: 5 },
            { re: /democrate/,                                   c: '#f59e0b', o: 6 },
            { re: /ensemble pour la republique|renaissance|republique en marche/, c: '#1d4ed8', o: 7 },
            { re: /horizons/,                                    c: '#0ea5e9', o: 8 },
            { re: /constructifs/,                                c: '#64748b', o: 8.6 },
            { re: /udi/,                                         c: '#38bdf8', o: 9 },
            { re: /agir/,                                        c: '#7dd3fc', o: 9.5 },
            { re: /droite republicaine|les republicains/,        c: '#1e3a8a', o: 10 },
            { re: /\budr\b|union des droites/,                   c: '#312e81', o: 11 },
            { re: /^a droite$/,                                  c: '#3730a3', o: 11.5 },
            { re: /rassemblement national/,                      c: '#334155', o: 12 },
            { re: /non inscrit/,                                 c: '#94a3b8', o: 99 }
        ];
        const cacheMeta = new Map();

        function metaGroupe(nomComplet) {
            if (cacheMeta.has(nomComplet)) return cacheMeta.get(nomComplet);
            const n = norm(nomComplet).trim();
            let meta = GROUPES_META.find(m => m.re.test(n));
            if (!meta) {
                meta = { c: '#94a3b8', o: 50 };
            }
            cacheMeta.set(nomComplet, meta);
            return meta;
        }

        function lireTotaux(s) {
            const rg = s.resultat_global || {};
            let pour = nombre(rg.pour ?? rg.nombre_pour);
            let contre = nombre(rg.contre ?? rg.nombre_contre);
            let abst = nombre(rg.abstention ?? rg.abstentions ?? rg.nombre_abstentions);

            if (pour === null || contre === null) {
                if (!Array.isArray(s.votes_par_groupe) || s.votes_par_groupe.length === 0) return null;
                pour = contre = abst = 0;
                s.votes_par_groupe.forEach(g => {
                    const d = g.detail || {};
                    pour += nombre(d.pour) || 0;
                    contre += nombre(d.contre) || 0;
                    abst += nombre(d.abstention) || 0;
                });
            }
            return { pour, contre, abst: abst || 0 };
        }

        function barreHtml(pour, contre, abst, classe = '') {
            const total = pour + contre + abst;
            if (total <= 0) return `<div class="bar ${classe}" aria-hidden="true"></div>`;
            const w = n => (n / total * 100).toFixed(2);
            return `<div class="bar ${classe}" aria-hidden="true">
                <span class="seg-pour" style="width:${w(pour)}%"></span><span class="seg-contre" style="width:${w(contre)}%"></span><span class="seg-abst" style="width:${w(abst)}%"></span>
            </div>`;
        }

        function scoreHtml(s) {
            const t = lireTotaux(s);
            if (!t) return '';
            const ecart = Math.abs(t.pour - t.contre);
            const resume = `${fmt(t.pour)} pour, ${fmt(t.contre)} contre, ${fmt(t.abst)} abstentions`;
            return `
                <div class="score" role="group" aria-label="Résultat : ${esc(resume)}">
                    <div class="score__nums">
                        <span class="score__n score__n--pour"><b>${fmt(t.pour)}</b> pour</span>
                        <span class="score__n score__n--contre"><b>${fmt(t.contre)}</b> contre</span>
                        <span class="score__n score__n--abst"><b>${fmt(t.abst)}</b> abst.</span>
                    </div>
                    ${barreHtml(t.pour, t.contre, t.abst, 'bar--big')}
                    <p class="score__marge">Écart : ${fmt(ecart)} voix</p>
                </div>`;
        }

        function groupesHtml(votesGroupes) {
            if (!Array.isArray(votesGroupes) || votesGroupes.length === 0) {
                return `<p class="bloc__vide">Détail par groupe non disponible.</p>`;
            }

            const lignes = votesGroupes.map(g => {
                const nom = getNomGroupe(g.nom_groupe);
                const d = g.detail || {};
                return {
                    nom,
                    meta: metaGroupe(nom),
                    pour: nombre(d.pour) || 0,
                    contre: nombre(d.contre) || 0,
                    abst: nombre(d.abstention) || 0
                };
            }).sort((a, b) => a.meta.o - b.meta.o);

            const items = lignes.map(l => {
                const total = l.pour + l.contre + l.abst;
                let position = '<span class="position">—</span>';
                if (total > 0) {
                    const max = Math.max(l.pour, l.contre, l.abst);
                    const [lib, cls, val] = max === l.pour ? ['Pour', 'pour', l.pour]
                        : max === l.contre ? ['Contre', 'contre', l.contre]
                        : ['Abst.', 'abst', l.abst];
                    position = `<span class="position position--${cls}">${lib} ${Math.round(val / total * 100)} %</span>`;
                }
                const aria = `${l.nom} : ${l.pour} pour, ${l.contre} contre, ${l.abst} abstentions`;
                return `
                    <li class="groupe" role="img" aria-label="${esc(aria)}">
                        <span class="nom-groupe" title="${esc(l.nom)}"><i style="--c:${esc(l.meta.c)}"></i>${esc(l.nom)}</span>
                        ${barreHtml(l.pour, l.contre, l.abst)}
                        ${position}
                    </li>`;
            }).join('');

            return `
                <ul class="legende" aria-hidden="true">
                    <li><i class="seg-pour"></i>Pour</li>
                    <li><i class="seg-contre"></i>Contre</li>
                    <li><i class="seg-abst"></i>Abstention</li>
                </ul>
                <ul class="groupes">${items}</ul>`;
        }

        function extraireTexte(valeur) {
            if (valeur === null || valeur === undefined || valeur === '') return '';
            if (typeof valeur === 'string' || typeof valeur === 'number') return esc(valeur);
            if (Array.isArray(valeur)) {
                return valeur.map(item => typeof item === 'object' && item !== null
                    ? Object.values(item).filter(Boolean).map(extraireTexte).join(' — ')
                    : extraireTexte(item)).join('<br>');
            }
            if (typeof valeur === 'object') {
                return Object.entries(valeur)
                    .map(([k, v]) => `<strong>${esc(k.replace(/_/g, ' '))} :</strong> ${extraireTexte(v)}`)
                    .join('<br>');
            }
            return '';
        }

        function formaterBlocRiche(contexteObj) {
            const vide = `<span class="bloc__vide">Non disponible.</span>`;
            if (!contexteObj) return { intentionsHtml: vide, critiqueHtml: vide, expertsHtml: vide };

            const valeurs = Object.values(contexteObj);

            const intentionsData = contexteObj.intentions_auteurs || contexteObj.mesures_cles || valeurs[0];
            const intentionsHtml = Array.isArray(intentionsData)
                ? intentionsData.map(i => `<div class="bloc__item">${typeof i === 'object' && i !== null
                    ? Object.values(i).filter(Boolean).map(extraireTexte).join(' : ')
                    : extraireTexte(i)}</div>`).join('')
                : (extraireTexte(intentionsData) || vide);

            const critiqueData = contexteObj.impact_et_critique || contexteObj.points_de_clivage || valeurs[1];
            const critiqueHtml = extraireTexte(critiqueData) || vide;

            const expertsData = contexteObj.avis_experts || valeurs[2];
            const expertsHtml = extraireTexte(expertsData) || vide;

            return { intentionsHtml: intentionsHtml || vide, critiqueHtml, expertsHtml };
        }

        const ONGLETS = [
            ['vote', '📊', 'Groupes'],
            ['essentiel', '📋', 'Mesures'],
            ['debat', '⚖️', 'Débat'],
            ['experts', '🔍', 'Fact-check']
        ];

        function carteHtml(scrutin) {
            const id = ++cardSeq;
            const decision = scrutin.resultat_global?.decision || scrutin.sort_libelle || 'Résultat';
            const estAdopte = decision.toLowerCase().includes('adopté');
            const blocs = formaterBlocRiche(scrutin.contexte_et_objectif);

            const tabs = ONGLETS.map(([k, ic, lib]) => `
                <button type="button" role="tab" id="tab-${id}-${k}" aria-controls="pane-${id}-${k}"
                        aria-selected="${k === 'vote'}" data-tab="${k}">
                    <span aria-hidden="true">${ic}</span><span>${lib}</span>
                </button>`).join('');

            return `
            <article class="card" data-tab="vote">
                <div class="card__head">
                    <span class="tag">${esc(scrutin.theme_principal || 'Général')}</span>
                    <div class="card__meta">
                        <span class="date">${esc(scrutin.date || scrutin.dateScrutin || '')}</span>
                        <span class="badge ${estAdopte ? 'badge--ok' : 'badge--ko'}">${esc(decision)}</span>
                    </div>
                </div>

                <h3 class="card__title">${esc(scrutin.titre_vulgarise || 'Titre non disponible')}</h3>
                <p class="card__official">📄 ${esc(scrutin.titre_officiel || scrutin.titre || 'Titre officiel non disponible')}</p>

                ${scoreHtml(scrutin)}

                <div class="tabs" role="tablist" aria-label="Sections du scrutin">${tabs}</div>

                <div class="pane pane--vote" role="tabpanel" id="pane-${id}-vote" aria-labelledby="tab-${id}-vote">
                    <h4 class="pane-title">Position de chaque groupe</h4>
                    ${groupesHtml(scrutin.votes_par_groupe)}
                </div>

                <div class="analyses">
                    <div class="pane pane--essentiel" role="tabpanel" id="pane-${id}-essentiel" aria-labelledby="tab-${id}-essentiel">
                        <div class="bloc bloc--essentiel">
                            <strong class="bloc__title">📋 Ce que change la loi</strong>
                            ${blocs.intentionsHtml}
                        </div>
                    </div>
                    <div class="pane pane--debat" role="tabpanel" id="pane-${id}-debat" aria-labelledby="tab-${id}-debat">
                        <div class="bloc bloc--debat">
                            <strong class="bloc__title">⚖️ Points de clivage &amp; débats</strong>
                            ${blocs.critiqueHtml}
                        </div>
                    </div>
                    <div class="pane pane--experts" role="tabpanel" id="pane-${id}-experts" aria-labelledby="tab-${id}-experts">
                        <div class="bloc bloc--experts">
                            <strong class="bloc__title">🔍 Fact-check &amp; experts</strong>
                            ${blocs.expertsHtml}
                        </div>
                    </div>
                </div>
            </article>`;
        }

        function appliquerFiltres() {
            const mots = norm(termeRecherche).split(/\s+/).filter(Boolean);
            filtres = scrutinsData.filter(s =>
                (themeActif === 'TOUS' || s.theme_principal === themeActif) &&
                mots.every(m => s._idx.includes(m))
            );

            affiches = 0;
            $container.innerHTML = '';

            if (filtres.length === 0) {
                $container.innerHTML = `<div class="etat">Aucun résultat trouvé. Essayez un autre mot-clé ou une autre thématique.</div>`;
            } else {
                afficherPage();
            }
            majCompteur();
        }

        function afficherPage() {
            const tranche = filtres.slice(affiches, affiches + PAGE_SIZE);
            $container.insertAdjacentHTML('beforeend', tranche.map(carteHtml).join(''));
            affiches += tranche.length;
            majCompteur();
        }

        function majCompteur() {
            const total = filtres.length;
            $compteur.textContent = total === 0
                ? ''
                : `${fmt(Math.min(affiches, total))} scrutin${affiches > 1 ? 's' : ''} affiché${affiches > 1 ? 's' : ''} sur ${fmt(total)}`;

            const reste = total - affiches;
            if (reste > 0) {
                $plus.hidden = false;
                $plus.textContent = `Afficher ${Math.min(PAGE_SIZE, reste)} scrutin${Math.min(PAGE_SIZE, reste) > 1 ? 's' : ''} de plus`;
            } else {
                $plus.hidden = true;
            }
        }

        function initialiserFiltres() {
            const themes = [...new Set(scrutinsData.map(s => s.theme_principal).filter(Boolean))];
            $filters.replaceChildren();

            const creer = (valeur, libelle) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'chip';
                b.dataset.theme = valeur;
                b.textContent = libelle;
                b.setAttribute('aria-pressed', String(valeur === themeActif));
                return b;
            };

            $filters.append(creer('TOUS', 'Tous'), ...themes.map(t => creer(t, t)));
        }

        $filters.addEventListener('click', e => {
            const btn = e.target.closest('[data-theme]');
            if (!btn) return;
            themeActif = btn.dataset.theme;
            $filters.querySelectorAll('[data-theme]').forEach(b =>
                b.setAttribute('aria-pressed', String(b === btn)));
            appliquerFiltres();
        });

        $container.addEventListener('click', e => {
            const btn = e.target.closest('[data-tab]');
            if (!btn) return;
            const carte = btn.closest('.card');
            if (!carte) return;
            carte.dataset.tab = btn.dataset.tab;
            carte.querySelectorAll('.tabs [data-tab]').forEach(b =>
                b.setAttribute('aria-selected', String(b === btn)));
        });

        $plus.addEventListener('click', afficherPage);

        let minuteur = null;
        function gererRecherche() {
            $clear.hidden = $search.value === '';
            clearTimeout(minuteur);
            minuteur = setTimeout(() => {
                termeRecherche = $search.value;
                appliquerFiltres();
            }, DEBOUNCE_MS);
        }
        $search.addEventListener('input', gererRecherche);
        $clear.addEventListener('click', () => {
            $search.value = '';
            $clear.hidden = true;
            clearTimeout(minuteur);
            termeRecherche = '';
            appliquerFiltres();
            $search.focus();
        });

        async function chargerDonnees() {
            try {
                const response = await fetch('./data_processed/scrutins_enrichis.json');
                if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`);
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('Format JSON inattendu');
                scrutinsData = data;

                scrutinsData.forEach(s => {
                    s._idx = norm([
                        s.titre_vulgarise, s.titre_officiel, s.titre, s.theme_principal,
                        ...collecterTexte(s.contexte_et_objectif)
                    ].filter(Boolean).join(' '));
                });

                initialiserFiltres();
                appliquerFiltres();
            } catch (error) {
                console.error('Erreur chargement :', error);
                $container.innerHTML = `
                    <div class="etat etat--erreur">
                        <strong>Impossible de charger le fichier JSON.</strong>
                        Vérifiez que le serveur local est actif.
                    </div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', chargerDonnees);
    </script>
</body>
</html>
