<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Vote Éclairé - Les votes de l'Assemblée nationale</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- En-tête sobre et ultra-compact -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-2xs">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-xl">🏛️</span>
                <h1 class="text-base font-bold text-slate-900 tracking-tight">Le Vote Éclairé</h1>
            </div>
            <span class="text-[10px] font-semibold px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full border border-indigo-100 uppercase tracking-wide">
                Direct Assemblée
            </span>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-4xl mx-auto px-3 sm:px-4 py-4 flex-grow w-full space-y-4">
        
        <!-- Zone de Filtres & Recherche -->
        <div class="bg-white p-3 rounded-2xl border border-slate-200/80 shadow-2xs space-y-3">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs">🔍</span>
                <input 
                    type="text" 
                    id="searchInput" 
                    oninput="gererRecherche()" 
                    placeholder="Rechercher un sujet, un mot-clé..." 
                    class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                >
            </div>

            <div id="theme-filters" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
                <button onclick="filtrerTheme('TOUS')" class="btn-theme whitespace-nowrap bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-medium transition">Tous</button>
            </div>
        </div>

        <!-- Conteneur des cartes de scrutins -->
        <section id="scrutins-container" class="space-y-4">
            <div class="text-center py-12 text-slate-400 text-xs">Chargement des scrutins...</div>
        </section>

    </main>

    <!-- Pied de page -->
    <footer class="border-t border-slate-200 bg-white py-4 text-center text-[11px] text-slate-400">
        <p>Données officielles en Open Data • Traitement pédagogique neutre par IA</p>
    </footer>

    <!-- JavaScript -->
    <script>
        let scrutinsData = [];
        let themeActif = 'TOUS';
        let termeRecherche = '';

        function gererRecherche() {
            termeRecherche = document.getElementById('searchInput').value.toLowerCase().trim();
            afficherScrutins();
        }

        async function chargerDonnees() {
            try {
                const response = await fetch('./data_processed/scrutins_enrichis.json');
                if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`);
                scrutinsData = await response.json();
                initialiserFiltres();
                afficherScrutins();
            } catch (error) {
                console.error("Erreur chargement :", error);
                document.getElementById('scrutins-container').innerHTML = `
                    <div class="text-center py-10 bg-white rounded-2xl border border-rose-200 p-6">
                        <p class="text-xs font-bold text-rose-700">Impossible de charger le fichier JSON.</p>
                        <p class="text-[11px] text-slate-500 mt-1">Vérifiez que le serveur local est actif.</p>
                    </div>`;
            }
        }

        function formaterBlocRiche(contexteObj) {
            if (!contexteObj) return { intentionsHtml: '', critiqueHtml: '', expertsHtml: '' };

            function extraireTexte(valeur) {
                if (!valeur) return '';
                if (typeof valeur === 'string' || typeof valeur === 'number') return valeur;
                if (Array.isArray(valeur)) {
                    return valeur.map(item => typeof item === 'object' ? Object.values(item).filter(Boolean).join(' — ') : item).join('<br>');
                }
                if (typeof valeur === 'object') {
                    return Object.entries(valeur).map(([k, v]) => `<strong>${k.replace(/_/g, ' ')} :</strong> ${extraireTexte(v)}`).join('<br>');
                }
                return '';
            }

            const intentionsData = contexteObj.intentions_auteurs || contexteObj.mesures_cles || Object.values(contexteObj)[0];
            let intentionsHtml = Array.isArray(intentionsData) 
                ? intentionsData.map(i => `<div class="mb-1.5 text-xs text-slate-700">🔹 ${typeof i === 'object' ? Object.values(i).filter(Boolean).join(' : ') : i}</div>`).join('')
                : `<div class="text-xs text-slate-700">${extraireTexte(intentionsData)}</div>`;

            const critiqueData = contexteObj.impact_et_critique || contexteObj.points_de_clivage || Object.values(contexteObj)[1];
            let critiqueHtml = `<div class="text-xs text-slate-700 space-y-1">${extraireTexte(critiqueData)}</div>`;

            const expertsData = contexteObj.avis_experts || Object.values(contexteObj)[2];
            let expertsHtml = `<div class="text-xs text-slate-700 space-y-1">${extraireTexte(expertsData)}</div>`;

            return { intentionsHtml, critiqueHtml, expertsHtml };
        }

        function initialiserFiltres() {
            const themes = ['TOUS', ...new Set(scrutinsData.map(s => s.theme_principal).filter(Boolean))];
            const filterContainer = document.getElementById('theme-filters');
            
            filterContainer.innerHTML = themes.map(t => {
                const tSec = t.replace(/'/g, "\\'");
                const active = t === themeActif;
                const cls = active 
                    ? "btn-theme whitespace-nowrap bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-medium shadow-2xs transition" 
                    : "btn-theme whitespace-nowrap bg-slate-100 border border-slate-200 text-slate-600 hover:bg-slate-200 px-3 py-1 rounded-full text-xs font-medium transition";
                return `<button onclick="filtrerTheme('${tSec}')" class="${cls}">${t}</button>`;
            }).join('');
        }

        function filtrerTheme(theme) {
            themeActif = theme;
            document.querySelectorAll('.btn-theme').forEach(btn => {
                const txt = btn.innerText.trim();
                if (txt === theme || (theme === 'TOUS' && txt === 'Tous')) {
                    btn.className = "btn-theme whitespace-nowrap bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-medium shadow-2xs transition";
                } else {
                    btn.className = "btn-theme whitespace-nowrap bg-slate-100 border border-slate-200 text-slate-600 hover:bg-slate-200 px-3 py-1 rounded-full text-xs font-medium transition";
                }
            });
            afficherScrutins();
        }

        function switcherSousOnglet(cardIdx, sectionName) {
            const sections = ['vote', 'essentiel', 'debat', 'experts'];
            sections.forEach(sec => {
                const el = document.getElementById(`card-${cardIdx}-${sec}`);
                const btn = document.getElementById(`btn-${cardIdx}-${sec}`);
                if (el && btn) {
                    if (sec === sectionName) {
                        el.classList.remove('hidden');
                        btn.className = "flex-1 py-1.5 text-center text-[11px] font-bold text-indigo-700 bg-white rounded-lg shadow-2xs transition";
                    } else {
                        el.classList.add('hidden');
                        btn.className = "flex-1 py-1.5 text-center text-[11px] font-medium text-slate-500 hover:text-slate-800 transition";
                    }
                }
            });
        }

        function afficherScrutins() {
            const container = document.getElementById('scrutins-container');
            if (!container) return;

            let filtrés = themeActif === 'TOUS' ? scrutinsData : scrutinsData.filter(s => s.theme_principal === themeActif);

            if (termeRecherche) {
                filtrés = filtrés.filter(s => {
                    const tv = (s.titre_vulgarise || '').toLowerCase();
                    const to = (s.titre_officiel || s.titre || '').toLowerCase();
                    const th = (s.theme_principal || '').toLowerCase();
                    const ctx = s.contexte_et_objectif ? JSON.stringify(s.contexte_et_objectif).toLowerCase() : '';
                    return tv.includes(termeRecherche) || to.includes(termeRecherche) || th.includes(termeRecherche) || ctx.includes(termeRecherche);
                });
            }

            if (filtrés.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-200 p-4">
                        <p class="text-slate-400 text-xs">Aucun résultat trouvé.</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtrés.map((scrutin, idx) => {
                const estAdopte = (scrutin.resultat_global?.decision || scrutin.sort_libelle || '').toLowerCase().includes('adopté');
                const badgeColor = estAdopte ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200';
                const blocs = formaterBlocRiche(scrutin.contexte_et_objectif);

                return `
                <article class="bg-white border border-slate-200/90 rounded-2xl p-4 sm:p-6 shadow-2xs">
                    
                    <!-- Header Carte -->
                    <div class="flex items-center justify-between gap-2 mb-2">
                        <span class="text-[10px] font-semibold px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md">
                            ${scrutin.theme_principal || 'Général'}
                        </span>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-slate-400">${scrutin.date || scrutin.dateScrutin || ''}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${badgeColor}">
                                ${scrutin.resultat_global?.decision || scrutin.sort_libelle || 'Résultat'}
                            </span>
                        </div>
                    </div>

                    <!-- Titre -->
                    <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-snug mb-3">
                        ${scrutin.titre_vulgarise || 'Titre non disponible'}
                    </h3>

                    <!-- Onglets mobiles (masqués sur desktop où tout s'affiche en clair) -->
                    <div class="flex md:hidden bg-slate-100 p-1 rounded-xl mb-3 border border-slate-200/50">
                        <button id="btn-${idx}-vote" onclick="switcherSousOnglet(${idx}, 'vote')" class="flex-1 py-1.5 text-center text-[11px] font-bold text-indigo-700 bg-white rounded-lg shadow-2xs transition">📊 Vote</button>
                        <button id="btn-${idx}-essentiel" onclick="switcherSousOnglet(${idx}, 'essentiel')" class="flex-1 py-1.5 text-center text-[11px] font-medium text-slate-500 hover:text-slate-800 transition">📋 Mesures</button>
                        <button id="btn-${idx}-debat" onclick="switcherSousOnglet(${idx}, 'debat')" class="flex-1 py-1.5 text-center text-[11px] font-medium text-slate-500 hover:text-slate-800 transition">⚖️ Débat</button>
                        <button id="btn-${idx}-experts" onclick="switcherSousOnglet(${idx}, 'experts')" class="flex-1 py-1.5 text-center text-[11px] font-medium text-slate-500 hover:text-slate-800 transition">🔍 Fact-check</button>
                    </div>

                    <!-- Contenu : Sur Desktop (md:) tout est visible simultanément en grille -->
                    <div class="space-y-4">
                        
                        <!-- 1. Graphique / Vote -->
                        <div id="card-${idx}-vote" class="block space-y-2">
                            <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider hidden md:block mb-2">Ventilation du vote</h4>
                            <div class="h-48 sm:h-56 relative pt-1">
                                <canvas id="chart-${idx}"></canvas>
                            </div>
                        </div>

                        <!-- Grille Desktop des 3 blocs d'analyse textuelle -->
                        <div class="grid md:grid-cols-3 gap-3">
                            <!-- Mesures -->
                            <div id="card-${idx}-essentiel" class="block space-y-3 pt-1">
                                <div class="bg-blue-50/60 p-3 rounded-xl border border-blue-100 border-l-4 border-l-blue-500 h-full">
                                    <strong class="block text-[10px] font-bold text-blue-900 uppercase tracking-wider mb-1">📋 Ce que change la loi</strong>
                                    ${blocs.intentionsHtml}
                                </div>
                            </div>

                            <!-- Points de clivage / Avis critiques (Opposition) -->
                            <div id="card-${idx}-debat" class="hidden md:block space-y-3 pt-1">
                                <div class="bg-amber-50/60 p-3 rounded-xl border border-amber-100 border-l-4 border-l-amber-500 h-full">
                                    <strong class="block text-[10px] font-bold text-amber-900 uppercase tracking-wider mb-1">⚖️ Points de clivage & Débats</strong>
                                    ${blocs.critiqueHtml}
                                </div>
                            </div>

                            <!-- Fact-check & Experts -->
                            <div id="card-${idx}-experts" class="hidden md:block pt-1">
                                <div class="bg-purple-50/60 p-3 rounded-xl border border-purple-200 h-full">
                                    <div class="flex items-center justify-between mb-1">
                                        <span class="text-[10px] font-bold text-purple-950 uppercase tracking-wider">🔍 Fact-check & Experts</span>
                                    </div>
                                    <div class="text-slate-700 text-xs leading-relaxed space-y-1">
                                        ${blocs.expertsHtml}
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                </article>`;
            }).join('');

            // Rendu des graphiques
            filtrés.forEach((scrutin, idx) => {
                if (scrutin.votes_par_groupe) {
                    rendreGraphique(`chart-${idx}`, scrutin.votes_par_groupe);
                }
            });
        }

        function rendreGraphique(canvasId, votesGroupes) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            const labels = votesGroupes.map(g => g.nom_groupe);
            const dataPour = votesGroupes.map(g => g.detail.pour);
            const dataContre = votesGroupes.map(g => g.detail.contre);
            const dataAbstention = votesGroupes.map(g => g.detail.abstention);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Pour', data: dataPour, backgroundColor: '#10b981', borderRadius: 3 },
                        { label: 'Contre', data: dataContre, backgroundColor: '#f43f5e', borderRadius: 3 },
                        { label: 'Abstention', data: dataAbstention, backgroundColor: '#cbd5e1', borderRadius: 3 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, grid: { display: false }, ticks: { font: { size: 9 } } },
                        y: { stacked: true, beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { font: { size: 9 } } }
                    },
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 10 } } }
                    }
                }
            });
        }

        window.addEventListener('DOMContentLoaded', chargerDonnees);
    </script>
</body>
</html>
